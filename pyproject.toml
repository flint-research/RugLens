[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ruglens"
version = "0.2.0"
description = "Open-source, evidence-driven EVM and Solana token rug-pull and risk detection engine"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Flint Research" }]
keywords = ["ethereum", "security", "rugpull", "honeypot", "evm", "defi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.9,<3",
    "web3>=7.6,<8",
    "eth-abi>=5.2,<6",
    "eth-utils>=5.1,<6",
    "pyevmasm>=0.2.3,<1",
    "typer>=0.15,<1",
    "rich>=13.9,<15",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "httpx>=0.27,<1",
    "aiohttp>=3.9,<4",
    "networkx>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "hypothesis>=6.115,<7",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
    "mypy>=1.13,<3",
    "pip-audit>=2.7,<3",
]
slither = ["slither-analyzer>=0.10,<1"]

[project.scripts]
ruglens = "ruglens.interfaces.cli.main:app"

[project.urls]
Homepage = "https://github.com/flint-research/ruglens"
Documentation = "https://github.com/flint-research/ruglens/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ruglens = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that do not require external network access",
    "simulation: tests that spawn local Anvil processes",
    "network: tests that require live RPC access",
    "slow: long-running tests",
]
filterwarnings = [
    "error::DeprecationWarning:ruglens.*",
]

[tool.coverage.run]
source = ["ruglens"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist", "contracts/out", "contracts/cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ASYNC", "RUF", "SIM", "C4", "PIE"]
ignore = [
    "E501",   # line length handled by the formatter
    "B008",   # Typer/FastAPI dependency defaults are intentional
    "RUF001", # ambiguous unicode in docstrings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "N806"]
"scripts/**/*.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = false
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = ["^tests/", "^scripts/", "^datasets/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pyevmasm.*",
    "web3.*",
    "eth_abi.*",
    "aiosqlite.*",
    "uvicorn.*",
    "pytest.*",
    "hypothesis.*",
]
ignore_missing_imports = true
